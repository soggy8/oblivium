[project]
name = "oblivium-atelier-backend"
version = "0.1.0"
description = "FastAPI backend for Oblivium Atelier lead capture."
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "email-validator",
  "fastapi",
  "psycopg[binary]",
  "pydantic-settings",
  "SQLAlchemy",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "ruff",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
