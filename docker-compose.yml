services:
  postgres:
    image: postgres:17
    container_name: oblivium-postgres
    environment:
      POSTGRES_DB: oblivium
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oblivium"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
